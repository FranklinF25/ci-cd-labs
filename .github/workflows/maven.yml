name: Java CI with Maven

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: mvn -B compile --file pom.xml

      - name: Unit Tests
        run: mvn -B test --file pom.xml

      - name: Package + Code Coverage (JaCoCo)
        run: mvn -B clean verify --file pom.xml

      - name: Show artifact and coverage
        run: |
          echo "=== Artifact ==="
          ls -lh target/*.jar
          echo "=== JaCoCo report ==="
          ls target/site/jacoco/

name: Deploy

# CD completo: al pushear un tag v* se despliega automáticamente a la
# infraestructura (EC2 con Nginx + Blue-Green) usando los mismos scripts/
# que se ejecutan localmente. Nota: no se usa el evento "release published"
# como disparador principal porque las Releases las publica un workflow con
# GITHUB_TOKEN, y GitHub suprime los eventos generados por ese token
# (anti-recursión). El tag es evento del usuario y sí dispara.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a desplegar (ej: 1.2.0)'
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Blue-Green Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH access to the EC2
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ec2
          chmod 600 ~/.ssh/id_ec2
          cat > ~/.ssh/config << EOF
          Host aws-lab
            HostName ${EC2_HOST}
            User ubuntu
            IdentityFile ~/.ssh/id_ec2
            StrictHostKeyChecking accept-new
          EOF

      - name: Determine version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${REF_NAME#v}"
          fi
          echo "Deploying version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Run Blue-Green deploy (scripts/deploy.sh)
        run: scripts/deploy.sh "${{ steps.version.outputs.version }}"

      - name: Verify traffic through the load balancer
        run: scripts/traffic-test.sh 5
